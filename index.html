<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>javascript illust animation | okojo</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        background: #ffffff;
        color: #4a4458;
      }
      nav { padding: 12px 20px; font-size: 14px; letter-spacing: 1px; color: #b0a0cd; }
      main { flex: 1; display: grid; place-items: center; }
      #stage { width: min(90vmin, 620px); aspect-ratio: 1 / 1; }
      #stage svg { width: 100%; height: 100%; display: block; }
      footer { padding: 10px 20px; font-size: 12px; color: #c0b6d0; }
      #expressions { display: flex; gap: 8px; justify-content: center; padding: 4px 0 14px; }
      #expressions button {
        font: inherit; font-size: 13px; padding: 6px 16px; cursor: pointer;
        border: 1px solid #ded6ea; border-radius: 999px;
        background: #fff; color: #6b6180;
      }
      #expressions button.on { background: #ede6f7; border-color: #c3b3dd; color: #4a4066; }
      @media (prefers-color-scheme: dark) {
        #expressions button { background: #211d2b; border-color: #3a3348; color: #b7addd; }
        #expressions button.on { background: #37304a; border-color: #574c72; color: #e6dffa; }
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14121a; color: #cfc6de; }
      }
    </style>
  </head>
  <body>
    <nav>OKOJO — drawn purely in JavaScript (no photo)</nav>
    <main>
      <div id="stage"></div>
    </main>
    <div id="expressions"></div>
    <footer><span id="info">assets/SD.png を写真を使わず JS だけで再現</span></footer>
    <!--
      解析をかけ直しても、ブラウザが古い shapes.js / main.js を握ったままだと
      直したはずのものを直っていないと読み違える。実際それで、耳のコードが
      入っていない main.js を相手に「耳が出ない」と調べる羽目になった。
      毎回別の URL にして掴ませない。
    -->
    <script>
      for (const src of ["shapes.js", "main.js"]) {
        document.write(
          '<script src="' + src + '?v=' + Date.now() + '"><\/script>'
        );
      }
    </script>
  </body>
</html>
