<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>javascript illust animation | okojo</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        background: #ffffff;
        color: #4a4458;
      }
      nav { padding: 12px 20px; font-size: 14px; letter-spacing: 1px; color: #b0a0cd; }
      main { flex: 1; display: grid; place-items: center; }
      #stage { width: min(90vmin, 620px); aspect-ratio: 1 / 1; }
      #stage svg { width: 100%; height: 100%; display: block; }
      footer { padding: 10px 20px; font-size: 12px; color: #c0b6d0; }
      @media (prefers-color-scheme: dark) {
        body { background: #14121a; color: #cfc6de; }
      }
    </style>
  </head>
  <body>
    <nav>OKOJO — drawn purely in JavaScript (no photo)</nav>
    <main>
      <div id="stage"></div>
    </main>
    <footer><span id="info">assets/SD.png を写真を使わず JS だけで再現</span></footer>
    <script src="shapes.js"></script>
    <script src="main.js"></script>
  </body>
</html>
